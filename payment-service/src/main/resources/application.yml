server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: TDTU_SOA_IBANKING_SECRET_KEY_FOR_JWT_AUTHENTICATION_CS504070_VERY_SECURE

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  tuition:
    url: ${TUITION_SERVICE_URL:http://localhost:8083}
  otp:
    url: ${OTP_SERVICE_URL:http://localhost:8084}

